<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleigh Catch</title>
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=mountains-of-christmas:700|fredoka:400,600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Start screen overlay -->
  <div id="start-screen" class="overlay">
    <h1 id="game-title">🎄 Sleigh Catch 🎄</h1>
    <p id="how-to-play">Catch 🎁 gifts and 🍪 cookies — dodge 🪨 coal!</p>
    <button id="start-btn">Start</button>
    <!-- Face picker — hidden file input triggered by the label-button -->
    <input type="file" id="face-input" accept="image/*" style="display:none" aria-label="Pick a photo">
    <label id="face-btn" for="face-input">📸 Use my face</label>
    <button id="remove-face-btn" class="hidden">❌ Remove my face</button>
    <p id="face-note" class="face-note hidden">Your photo stays on this device only.</p>
  </div>

  <!-- Mute button (always visible, top-right) -->
  <button id="mute-btn" aria-label="Toggle sound">🔊</button>

  <!-- HUD (hidden until game starts) -->
  <div id="hud" class="hud hidden">
    <span id="hud-score">Score: 0</span>
    <span id="hud-combo" style="display:none"></span>
    <span id="hud-reindeer" style="display:none"></span>
    <span id="hud-lives">❤️❤️❤️</span>
  </div>

  <!-- Active power-up icons + timer bars -->
  <div id="power-hud" class="power-hud hidden"></div>

  <!-- Combo banner (centred, animated) -->
  <div id="combo-banner" aria-live="polite"></div>

  <!-- Game-over overlay -->
  <div id="gameover-screen" class="overlay hidden">
    <h1 id="go-title">Game Over</h1>
    <p id="go-score"></p>
    <p id="go-best"></p>
    <p id="go-new-best" class="new-best hidden">🏆 New best!</p>
    <button id="replay-btn">Play Again</button>
    <button id="postcard-btn">🎄 Make a postcard</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9/dist/confetti.browser.min.js" defer></script>
  <script src="leaderboard.js" defer></script>
  <script src="game.js" defer></script>
</body>
</html>
